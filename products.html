<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LELLA - Produits | Poulet Halal</title>
    <meta name="description" content="Découvrez notre sélection de poulet halal frais : poulet entier, cuisses, ailes. Qualité LELLA garantie.">
    <link rel="icon" type="image/jpeg" href="img/fav.jpeg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/refine.css">
    <script>try{if(!sessionStorage.lellaSeen&&!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("pre")}catch(e){}</script>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/lella-green.png" alt="LELLA" class="wordmark" width="84" height="41">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fa-solid fa-house me-1"></i>Accueil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="products.html">
                            <i class="fa-solid fa-store me-1"></i>Produits
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            <i class="fa-solid fa-circle-info me-1"></i>À propos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            <i class="fa-solid fa-envelope me-1"></i>Contact
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container text-center">
            <h1 class="page-header-title">Nos Produits</h1>
            <p class="page-header-sub">Poulet, burgers, saucisses et plus. Frais et halal, livrés à Conakry</p>
        </div>
    </div>

    <!-- Products Section -->
    <section class="products-section section-pad">
        <div class="container">

            <!-- Filter Bar -->
            <div class="filter-bar reveal">
                <div class="filter-label">
                    <i class="fa-solid fa-sliders me-2"></i>Filtrer par :
                </div>
                <div class="filter-buttons" id="filterButtons">
                    <button class="filter-btn active" data-filter="all">Tous</button>
                    <button class="filter-btn" data-filter="poulet"><i class="fa-solid fa-drumstick-bite"></i>Poulet</button>
                    <button class="filter-btn" data-filter="boeuf"><i class="fa-solid fa-burger"></i>Bœuf et autres</button>
                </div>
                <div class="filter-count" id="filterCount"></div>
            </div>

            <!-- Products Grid -->
            <div class="row g-3 g-md-4 mt-2" id="productsGrid"></div>

            <!-- Empty state for filter -->
            <div id="noResults" class="text-center py-5" style="display:none">
                <i class="fa-solid fa-filter-circle-xmark fa-3x text-muted mb-3"></i>
                <p class="text-muted">Aucun produit trouvé pour ce filtre.</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 mb-3 mb-md-0">
                    <div class="footer-brand">
                        <img src="img/lella-white.png" alt="LELLA" class="wordmark" width="84" height="41">
                    </div>
                    <p class="footer-tagline">Halal • Fresh • Quality</p>
                </div>
                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <div class="footer-links">
                        <a href="index.html">Accueil</a>
                        <a href="products.html">Produits</a>
                        <a href="about.html">À propos</a>
                        <a href="contact.html">Contact</a>
                        <a href="basket.html">Panier</a>
                    </div>
                </div>
                <div class="col-md-4 text-md-end">
                    <a href="https://wa.me/224629853624" target="_blank" class="footer-social">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                    <a href="tel:+224629853624" class="footer-social">
                        <i class="fa-solid fa-phone"></i>
                    </a>
                </div>
            </div>
            <hr class="footer-divider">
            <p class="footer-copy text-center mb-0">
                &copy; <span id="copyrightYear"></span> LELLA. Tous droits réservés.
            </p>
        </div>
    </footer>

    <!-- Floating Cart -->
    <a href="basket.html" class="floating-cart-btn" id="floatingCartBtn" aria-label="Panier">
        <i class="fa-solid fa-basket-shopping"></i>
        <span class="floating-cart-badge" id="floatingCartCount" style="display:none">0</span>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
    <script src="js/refine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            renderProducts();
            updateBasketCount();
            initFilterButtons();
        });
        document.getElementById('copyrightYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
